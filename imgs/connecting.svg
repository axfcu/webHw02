<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 科技感漸層 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="60%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#7f53ac"/>
    </linearGradient>

    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a1c29"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- 發光濾鏡 -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 背景：完全透明，無任何底色元素 -->

  <!-- 連線信號波與科技環 (背景裝飾) -->
  <g stroke="#00f2fe" fill="none" opacity="0.6">
    <!-- Wi-Fi / 信號波 -->
    <path d="M 190 70 A 70 70 0 0 1 310 70" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
    <path d="M 210 90 A 45 45 0 0 1 290 90" stroke-width="3" stroke-linecap="round"/>
    
    <!-- 旋轉科技環 -->
    <circle cx="380" cy="160" r="35" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="380" cy="160" r="25" stroke="#ff007f" stroke-width="2"/>
    <circle cx="110" cy="300" r="30" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 外星龍蜥生物本體 -->
  <g id="alien-character">
    <!-- 尾巴 -->
    <path d="M 290 350 C 370 360 410 290 380 240 C 375 230 365 240 370 255 C 385 290 340 330 280 340 Z" 
          fill="url(#bodyGrad)" stroke="#1a1c29" stroke-width="3"/>
    <!-- 尾部背鰭 -->
    <polygon points="340,315 355,300 355,320" fill="#00f2fe" filter="url(#neonGlow)"/>
    <polygon points="370,280 385,265 380,288" fill="#00f2fe" filter="url(#neonGlow)"/>

    <!-- 身體與胸甲 -->
    <ellipse cx="250" cy="330" rx="65" ry="75" fill="url(#bodyGrad)" stroke="#1a1c29" stroke-width="3"/>
    <path d="M 220 285 Q 250 295 280 285 L 275 340 Q 250 365 225 340 Z" fill="url(#armorGrad)" stroke="#00f2fe" stroke-width="2"/>
    <!-- 機甲核心反應爐 -->
    <polygon points="250,305 262,315 258,328 242,328 238,315" fill="#00f2fe" filter="url(#neonGlow)"/>

    <!-- 腳部 -->
    <ellipse cx="210" cy="395" rx="22" ry="14" fill="url(#armorGrad)" stroke="#1a1c29" stroke-width="3"/>
    <ellipse cx="285" cy="395" rx="22" ry="14" fill="url(#armorGrad)" stroke="#1a1c29" stroke-width="3"/>

    <!-- 外星萌頭 -->
    <ellipse cx="250" cy="200" rx="75" ry="65" fill="url(#bodyGrad)" stroke="#1a1c29" stroke-width="3"/>

    <!-- 觸角天線 -->
    <path d="M 215 150 Q 185 90 170 100" fill="none" stroke="#2c3e50" stroke-width="6" stroke-linecap="round"/>
    <circle cx="170" cy="100" r="12" fill="#ff007f" filter="url(#neonGlow)"/>

    <path d="M 285 150 Q 315 90 330 100" fill="none" stroke="#2c3e50" stroke-width="6" stroke-linecap="round"/>
    <circle cx="330" cy="100" r="12" fill="#00f2fe" filter="url(#neonGlow)"/>

    <!-- 科幻耳罩式耳機與通話麥克風 -->
    <path d="M 175 190 A 75 75 0 0 1 325 190" fill="none" stroke="#1a1c29" stroke-width="8"/>
    <rect x="165" y="175" width="18" height="40" rx="8" fill="#ff007f" filter="url(#neonGlow)"/>
    <rect x="317" y="175" width="18" height="40" rx="8" fill="#00f2fe" filter="url(#neonGlow)"/>
    <!-- 延伸麥克風 -->
    <path d="M 325 210 Q 315 240 280 240" fill="none" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
    <circle cx="278" cy="240" r="5" fill="#00f2fe"/>

    <!-- 大眼睛 (水汪汪可愛感) -->
    <!-- 左眼 -->
    <ellipse cx="215" cy="200" rx="18" ry="24" fill="#0f1123"/>
    <circle cx="210" cy="192" r="7" fill="#ffffff"/>
    <circle cx="222" cy="208" r="3" fill="#00f2fe"/>
    
    <!-- 右眼 -->
    <ellipse cx="285" cy="200" rx="18" ry="24" fill="#0f1123"/>
    <circle cx="280" cy="192" r="7" fill="#ffffff"/>
    <circle cx="292" cy="208" r="3" fill="#00f2fe"/>

    <!-- 自信微笑嘴巴 -->
    <path d="M 242 230 Q 250 238 258 230" fill="none" stroke="#1a1c29" stroke-width="3" stroke-linecap="round"/>

    <!-- 手部操作全息螢幕 -->
    <!-- 左手握著全息板 -->
    <ellipse cx="185" cy="315" rx="14" ry="12" fill="url(#bodyGrad)" stroke="#1a1c29" stroke-width="2"/>
    <!-- 全息半透明面板 -->
    <polygon points="120,270 200,250 185,330 110,340" fill="#00f2fe" fill-opacity="0.25" stroke="#00f2fe" stroke-width="2" filter="url(#neonGlow)"/>
    <line x1="125" y1="285" x2="185" y2="270" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    <line x1="123" y1="300" x2="165" y2="290" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="140" cy="320" r="6" fill="#ff007f" opacity="0.8"/>
  </g>

  <!-- 底部文字與進度 -->
  <g text-anchor="middle" font-family="'Segoe UI', Roboto, 'Noto Sans TC', sans-serif">
    <!-- 進度條 -->
    <rect x="175" y="425" width="150" height="8" rx="4" fill="#1a1c29" stroke="#00f2fe" stroke-width="1"/>
    <rect x="177" y="427" width="95" height="4" rx="2" fill="url(#glowGrad)" filter="url(#neonGlow)"/>

    <!-- 連線中文字 -->
    <text x="250" y="465" font-size="22" font-weight="900" fill="#00f2fe" letter-spacing="4" filter="url(#neonGlow)">
      連線中...
    </text>
    <text x="250" y="485" font-size="11" font-weight="700" fill="#ff007f" letter-spacing="2">
      CONNECTING
    </text>
  </g>
</svg>
